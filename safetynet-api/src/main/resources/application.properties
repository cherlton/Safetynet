spring.application.name=safetynet-api
server.port=${PORT:8080}

# In-Memory H2 Database Connection (No installation required)
spring.datasource.url=jdbc:h2:mem:crimedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# AI Service (Anthropic)
anthropic.api-key=${ANTHROPIC_API_KEY:mock-key}
anthropic.model=${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}

# AI Service (Gemini)
gemini.api-key=${GEMINI_API_KEY:mock-key}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# Google Maps API Key
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Twilio Webhook Configuration
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.validation-enabled=${TWILIO_VALIDATION_ENABLED:false}

