services:
  - type: web
    name: safetynet-api
    env: docker
    dockerContext: ./safetynet-api
    dockerfilePath: ./safetynet-api/Dockerfile
    plan: free
    healthCheckPath: /api/incidents
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
